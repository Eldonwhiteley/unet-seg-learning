[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unet-seg"
version = "0.1.0"
description = "U-Net semantic segmentation learning project in PyTorch"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pillow>=9.0.0",
    "tqdm>=4.65.0",
]

[tool.setuptools.packages.find]
where = ["src"]
